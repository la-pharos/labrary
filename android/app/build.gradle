plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasKeystore = keystorePropertiesFile.exists()

if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    println("⚠️ key.properties not found at: ${keystorePropertiesFile.path}")
    println("⚠️ Release signing will be skipped. Debug build will still work.")
}

android {
    namespace = "com.la_pharos.labrary"

    ndkVersion = "28.2.13676358"

    // 🔼 FlutterFire 최신 조합 권장값
    compileSdk = 36

    defaultConfig {
        applicationId = "com.la_pharos.labrary"
        minSdkVersion = flutter.minSdkVersion          // ✅ 최신 Firebase 패키지 권장
        targetSdk = 36

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // 🔼 AGP 8.x + JDK 17 권장
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                def storeFilePath = keystoreProperties['storeFile']
                println "📦 storeFilePath = ${storeFilePath}"

                if (storeFilePath == null || storeFilePath.toString().trim().isEmpty()) {
                    throw new GradleException("storeFile is missing or empty in key.properties")
                }

                storeFile file(storeFilePath)
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // 키 없으면 release 서명 설정을 비워둠 (debug 빌드는 영향 없음)
            }
        }
    }

    buildTypes {
        debug {
            // debug는 signingConfig 굳이 안 건드려도 됨
        }

        release {
            // ✅ 키가 있을 때만 signingConfig 적용
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // ❌ FlutterFire 플러터 패키지들이 내부에서 관리하므로 직접 자바 의존성 추가하지 마세요.
    // implementation 'com.google.firebase:firebase-auth:22.3.1'  // ← 삭제
}
